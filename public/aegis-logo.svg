<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon -->
  <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" stroke="#F59E0B" stroke-width="2.5" fill="none" opacity="0.9"/>
  <!-- Inner hexagon -->
  <polygon points="50,16 82,33.5 82,66.5 50,84 18,66.5 18,33.5" stroke="#F59E0B" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Center eye / core -->
  <circle cx="50" cy="50" r="14" fill="#F59E0B" opacity="0.15"/>
  <circle cx="50" cy="50" r="14" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="6" fill="#F59E0B"/>
  <!-- Inner glow dot -->
  <circle cx="50" cy="50" r="3" fill="white" opacity="0.8"/>
  <!-- Circuit lines - top -->
  <line x1="50" y1="36" x2="50" y2="16" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="22" x2="44" y2="22" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="19" x2="57" y2="19" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Circuit lines - bottom -->
  <line x1="50" y1="64" x2="50" y2="84" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="78" x2="56" y2="78" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="81" x2="43" y2="81" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Circuit lines - top-right -->
  <line x1="62" y1="43" x2="80" y2="33" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="76" y1="37" x2="76" y2="43" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Circuit lines - top-left -->
  <line x1="38" y1="43" x2="20" y2="33" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="37" x2="24" y2="43" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Circuit lines - bottom-right -->
  <line x1="62" y1="57" x2="80" y2="67" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="76" y1="63" x2="76" y2="57" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Circuit lines - bottom-left -->
  <line x1="38" y1="57" x2="20" y2="67" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="63" x2="24" y2="57" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Corner dots -->
  <circle cx="50" cy="4"  r="2.5" fill="#F59E0B"/>
  <circle cx="93" cy="27.5" r="2.5" fill="#F59E0B"/>
  <circle cx="93" cy="72.5" r="2.5" fill="#F59E0B"/>
  <circle cx="50" cy="96" r="2.5" fill="#F59E0B"/>
  <circle cx="7"  cy="72.5" r="2.5" fill="#F59E0B"/>
  <circle cx="7"  cy="27.5" r="2.5" fill="#F59E0B"/>
</svg>
